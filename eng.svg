<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" width="320" height="500">
  <!-- St Edward's Crown -->
  <g fill="#0C2340">
    <!-- Crown Base -->
    <rect x="60" y="110" width="200" height="30" rx="6" fill="#0C2340"/>
    <circle cx="80" cy="125" r="6" fill="#FFFFFF"/>
    <circle cx="120" cy="125" r="6" fill="#FFFFFF"/>
    <circle cx="160" cy="125" r="6" fill="#FFFFFF"/>
    <circle cx="200" cy="125" r="6" fill="#FFFFFF"/>
    <circle cx="240" cy="125" r="6" fill="#FFFFFF"/>
    <!-- Crown Arches & Cross -->
    <path d="M80,110 C80,60 160,50 160,50 C160,50 240,60 240,110 Z" fill="none" stroke="#0C2340" stroke-width="16"/>
    <!-- Cross Pattee on Top -->
    <path d="M155,20 L165,20 L165,35 L175,35 L175,45 L165,45 L165,55 L155,55 L155,45 L145,45 L145,35 L155,35 Z" fill="#0C2340"/>
    <circle cx="160" cy="38" r="8" fill="#0C2340"/>
    <!-- Three Royal Lions Passant Guardant -->
    <!-- Lion 1 -->
    <g transform="translate(50, 160) scale(0.65)">
      <path d="M30,30 Q90,10 160,25 Q230,15 280,45 Q260,75 220,60 Q170,85 140,55 Q100,75 50,60 Z" fill="#0C2340"/>
      <circle cx="45" cy="35" r="22" fill="#0C2340"/>
      <path d="M260,35 Q300,10 320,40 Q310,60 280,50 Z" fill="#0C2340"/>
      <path d="M70,55 L60,95 L90,95 L95,65 Z" fill="#0C2340"/>
      <path d="M210,55 L200,95 L230,95 L235,65 Z" fill="#0C2340"/>
    </g>
    <!-- Lion 2 -->
    <g transform="translate(50, 240) scale(0.65)">
      <path d="M30,30 Q90,10 160,25 Q230,15 280,45 Q260,75 220,60 Q170,85 140,55 Q100,75 50,60 Z" fill="#0C2340"/>
      <circle cx="45" cy="35" r="22" fill="#0C2340"/>
      <path d="M260,35 Q300,10 320,40 Q310,60 280,50 Z" fill="#0C2340"/>
      <path d="M70,55 L60,95 L90,95 L95,65 Z" fill="#0C2340"/>
      <path d="M210,55 L200,95 L230,95 L235,65 Z" fill="#0C2340"/>
    </g>
    <!-- Lion 3 -->
    <g transform="translate(50, 320) scale(0.65)">
      <path d="M30,30 Q90,10 160,25 Q230,15 280,45 Q260,75 220,60 Q170,85 140,55 Q100,75 50,60 Z" fill="#0C2340"/>
      <circle cx="45" cy="35" r="22" fill="#0C2340"/>
      <path d="M260,35 Q300,10 320,40 Q310,60 280,50 Z" fill="#0C2340"/>
      <path d="M70,55 L60,95 L90,95 L95,65 Z" fill="#0C2340"/>
      <path d="M210,55 L200,95 L230,95 L235,65 Z" fill="#0C2340"/>
    </g>
  </g>
  <text x="160" y="460" font-family="serif" font-weight="900" font-size="64" fill="#0C2340" text-anchor="middle" letter-spacing="6">ECB</text>
</svg>